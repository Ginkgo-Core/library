schema_version: ginkgo.repository-portfolio.v1
status: proposed
source_of_truth_for:
  - repository_identity
  - repository_role
  - cleanup_action
  - portfolio_stage
naming_policy:
  case: lowercase-kebab
  redundant_ginkgo_prefix_inside_ginkgo_org: forbidden_for_new_canonical_names
  prefer_domain_or_product_name: true
  suffix_only_when_disambiguating: true
organizations:
  Ginkgo-Core:
    role: shared_architecture_and_runtime_authorities
  Ginkgo-Seeds:
    role: incubation
  Ginkgo-Services:
    role: client_and_bounded_service_delivery
  LeafCRM:
    role: leaf_product_family
  Scale-Characters:
    role: creator_and_commerce_operations
repositories:
  - current: Ginkgo-Core/ai-stack
    target: Ginkgo-Core/ai-stack
    stage: CANONICAL
    action: KEEP
    domain: architecture_runtime_governance
  - current: Ginkgo-Core/ginkgo-runtime
    target: Ginkgo-Core/runtime
    stage: CANONICAL
    action: RENAME_AFTER_ARCHITECTURE_MERGE
