cleanup_gates:
  before_archive:
    - unique_commits_extracted
    - unique_assets_extracted
    - open_prs_and_issues_reviewed
    - dependency_refs_checked
    - provenance_preserved
  before_delete:
    - all_before_archive_gates
    - zero_required_history
    - zero_required_evidence
    - zero_live_dependency
    - explicit_owner_confirmation
  before_move_or_rename:
    - reference_inventory
    - write_freeze
    - open_pr_review
    - dependency_update_plan
    - post_move_ci_verification
