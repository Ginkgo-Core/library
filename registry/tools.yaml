version: 2
updated_at: 2026-08-18

# Concrete execution surfaces known to the Arsenal.
# Secrets are never stored here; only logical credential references.

tools:
  - id: google-gemini-api
    provider: google-ai
    kind: api
    execution_mode: autonomous
    capabilities: [reasoning.long-context, knowledge.research]
    auth:
      type: api_key
      credential_ref: GOOGLE_GEMINI_API_KEY
    billing_boundary: google-cloud-project
    status: available-when-api-billing-enabled

  - id: google-deep-research-ui
    provider: google-ai
    kind: web-ui
    execution_mode: human_assisted
    capabilities: [knowledge.research]
    auth:
      type: account_session
      credential_ref: GOOGLE_AI_PRO_ACCOUNT
    status: available

  - id: google-notebooklm
    provider: google-ai
    kind: web-ui
    execution_mode: human_assisted
    capabilities: [knowledge.notebook]
    auth:
      type: account_session
      credential_ref: GOOGLE_AI_PRO_ACCOUNT
    status: available

  - id: google-drive-connector
    provider: google-ai
    kind: connector
    execution_mode: connector
    capabilities: [storage.files]
    auth:
      type: oauth
      credential_ref: GOOGLE_DRIVE_CONNECTION
    status: available

  - id: github-api
    provider: github
    kind: api
    execution_mode: autonomous
    capabilities: [code.repo.inspect, code.issue.create, code.pr.open, code.review]
    auth:
      type: app_or_token
      credential_ref: GITHUB_CONNECTION
    status: available

  - id: supabase-api
    provider: supabase
    kind: api
    execution_mode: autonomous
    capabilities: [database.query, database.write, database.vector-search]
    auth:
      type: project_credentials
      credential_ref: SUPABASE_PROJECT_CONNECTION
    status: available

  - id: comfyui-local
    provider: local
    kind: http-api
    execution_mode: autonomous
    capabilities: [creative.image.local]
    endpoint_ref: comfyui-local-api
    auth:
      type: local-trusted-boundary
    status: validated
    validation_status: VALIDATED

  - id: gemini-image
    provider: google-ai
    kind: api
    execution_mode: autonomous
    capabilities: [creative.image.cloud]
    model_pin: gemini-2.5-flash-image
    auth:
      type: api_key
      credential_ref: GEMINI_API_KEY
    billing_boundary: google-cloud-project
    cost_estimate_usd_per_image: 0.039
    status: experimental
    validation_status: EXPERIMENTAL
    rules:
      - "Never eligible for normal production requests; explicit eval mode only."
      - "Never an automatic fallback for local capability."

  - id: higgsfield-mcp
    provider: higgsfield
    kind: mcp
    execution_mode: autonomous
    capabilities: [creative.video.cloud, creative.image.cloud]
    auth:
      type: account_connection
      credential_ref: HIGGSFIELD_CONNECTION
    status: curated

  - id: fal-api
    provider: fal
    kind: api
    execution_mode: autonomous
    capabilities: [creative.image.cloud, creative.video.cloud, creative.audio.cloud]
    auth:
      type: api_key
      credential_ref: FAL_API_KEY
    status: available

  - id: claude-code-local
    provider: local
    kind: cli
    execution_mode: supervised
    capabilities: [dev.async-coding]
    status: validated

  - id: codex-local
    provider: local
    kind: cli
    execution_mode: supervised
    capabilities: [dev.async-coding]
    status: available

  - id: amazon-sp-api
    provider: amazon-selling-partner
    kind: api
    execution_mode: autonomous
    capabilities: [commerce.catalog.search, commerce.pricing.read, commerce.inventory.read, commerce.orders.read]
    auth:
      type: oauth_refresh_token
      credential_refs: [AMZ_SP_CLIENT_ID, AMZ_SP_CLIENT_SECRET, AMZ_SP_REFRESH_TOKEN, AMZ_SELLER_ID, AMZ_MARKETPLACE_ID]
    status: planned
    validation_status: DISABLED
    routing_eligible: false
    production_eligible: false
    source_of_truth: Scale-Characters/amazon-ops
    rules:
      - "Registry presence is discovery metadata only; no merged adapter or live read E2E exists."
      - "Do not route callers to this tool until GitHub evidence promotes it."
      - "Read permissions only for the first batch."

  - id: shopee-open-api
    provider: shopee-open-platform
    kind: api
    execution_mode: autonomous
    capabilities: [commerce.catalog.read, commerce.orders.read]
    auth:
      type: oauth
      credential_refs: [SHOPEE_PARTNER_ID, SHOPEE_PARTNER_KEY, SHOPEE_SHOP_ID, SHOPEE_ACCESS_TOKEN, SHOPEE_REFRESH_TOKEN]
    status: pre-approval
    validation_status: DISABLED
    routing_eligible: false
    production_eligible: false
    external_gate: shopee_business_approval
    source_of_truth: Scale-Characters/amazon-ops#2
    rules:
      - "Offline adapter/test evidence exists, but provider has no approved live validation."
      - "PRE-APPROVAL means no live routing."
      - "Mutation scopes remain blocked and are not part of these read skills."

  - id: amazon-ops-shopee-normalizer
    provider: local
    kind: python-module
    execution_mode: autonomous
    capabilities: [commerce.product.normalize]
    implementation_ref: Scale-Characters/amazon-ops#2:integrations/shopee/catalog.py#normalize_product
    status: pre-approval-prototype
    validation_status: EXPERIMENTAL
    routing_eligible: false
    production_eligible: false
    rules:
      - "Fixture-tested only; Shopee skill lifecycle remains FEATURE/PRE_APPROVAL."
      - "No network or marketplace mutation authority."

  - id: amazon-ops-product-evaluator
    provider: local
    kind: python-module
    execution_mode: autonomous
    capabilities: [commerce.product.evaluate]
    implementation_refs:
      - Scale-Characters/amazon-ops:scripts/comparar.py
      - Scale-Characters/amazon-ops#2:integrations/shopee/candidate.py
    status: prototype
    validation_status: EXPERIMENTAL
    routing_eligible: false
    production_eligible: false
    policy_ref: commerce-evaluation-gates-v1
    rules:
      - "Deterministic numeric gates only; LLM does not calculate economic values."
      - "APPROVED is advisory and grants no publish/purchase authority."
      - "Thresholds are policy-owned, not caller inputs."

rules:
  - Never expose credential values through this registry.
  - execution_mode must describe what is truly automatable today.
  - A web-only product must not be advertised to agents as an autonomous API.
  - Tools are replaceable implementations of skills/capabilities, never product-level dependencies by default.
  - DISABLED marketplace tools are discoverable but never routing-eligible.
