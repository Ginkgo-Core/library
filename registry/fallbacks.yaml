version: 1
updated_at: 2026-08-17

fallbacks:
  - capability: knowledge.research
    order:
      - google-deep-research-ui
      - google-gemini-api
      - research.web-general
    fail_when:
      - no_current_sources
      - provider_unavailable

  # Wave 10: capabilities criativas específicas NÃO têm fallback cruzado local↔cloud.
  # Intenção do caller (privacidade/custo/residência) nunca é violada em silêncio;
  # ausência de opção VALIDATED produz erro normalizado NO_VALIDATED_PROVIDER.
  - capability: creative.image.local
    order:
      - comfyui-local
    fail_when:
      - local_gpu_unavailable
      - local_runtime_unhealthy
    no_cross_fallback: true

  - capability: creative.image.cloud
    order:
      - fal-api          # somente quando VALIDATED; gemini-image permanece EXPERIMENTAL
    fail_when:
      - provider_unavailable
      - quota_exhausted
      - no_validated_provider
    no_cross_fallback: true

  - capability: creative.video.cloud
    order:
      - higgsfield-mcp
      - fal-api
    fail_when:
      - provider_unavailable
      - quota_exhausted

  - capability: dev.async-coding
    order:
      - claude-code-local
      - codex-local
    fail_when:
      - executor_unavailable
      - repo_permission_missing

  - capability: storage.files
    order:
      - google-drive-connector
    fail_when:
      - connector_unavailable
      - destination_policy_denied

rules:
  - Fallbacks preserve the skill output contract whenever possible.
  - Provider-specific features may require a degraded-result marker.
  - Do not silently switch to a higher-cost provider without policy evaluation.
  - A missing safe fallback is preferable to an unsafe implicit fallback.
