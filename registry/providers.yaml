      - knowledge-notebooks
      - image-generation
      - video-generation
      - music-generation
      - ai-prototyping
      - coding-agents
      - cloud-storage
      - workspace-assistance
    products:
      - Gemini
      - NotebookLM
      - Google Flow
      - Google Flow Music
      - Google AI Studio
      - Google Antigravity
      - Jules
      - Google Drive
      - Gmail
      - Docs
      - Sheets
    rules:
      - "Subscription UI benefits do not imply free or unlimited API usage."
      - "Programmatic Gemini usage must be accounted for under Gemini API / Google Cloud quotas and billing."
      - "Usage limits and plan entitlements are volatile; verify official documentation before automating around a numeric quota."
      - "Personal Google AI plans are not the canonical storage boundary for enterprise client secrets or regulated data."
    preferred_consumers:
      - Ginkgo-Core/ginkgo-library
      - Ginkgo-Core/ginkgo-source
      - Ginkgo-Core/Sylvia
      - Ginkgo-Core/ai-stack
