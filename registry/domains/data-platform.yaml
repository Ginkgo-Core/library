capabilities:
  - id: data.record.read
    purpose: Read authorized structured records independently of the backing provider.
    bindings:
      - binding_id: supabase-postgrest.record.read
        routing_eligible: false
    lifecycle_ceiling: FEATURE

  - id: identity.user.read
    purpose: Read authorized identity/profile state under tenant and privacy policy.
    bindings:
      - binding_id: supabase-auth.user.read
        routing_eligible: false
    lifecycle_ceiling: FEATURE

  - id: storage.object.read
    purpose: Read authorized object metadata or content through a normalized storage contract.
    bindings:
      - binding_id: supabase-storage.object.read
        routing_eligible: false
    lifecycle_ceiling: FEATURE

  - id: knowledge.vector.search
    purpose: Retrieve authorized semantic/vector matches without exposing the vector implementation to callers.
    bindings:
      - binding_id: supabase-pgvector.search
        routing_eligible: false
    lifecycle_ceiling: FEATURE

  - id: database.schema.inspect
    purpose: Inspect authorized database schema metadata without granting mutation authority.
    bindings:
      - binding_id: supabase-mcp.schema.inspect
        routing_eligible: false
    lifecycle_ceiling: FEATURE

  - id: events.stream.subscribe
    purpose: Subscribe to authorized changes through a normalized realtime event contract.
    bindings:
      - binding_id: supabase-realtime.subscribe
        routing_eligible: false
    lifecycle_ceiling: FEATURE

  - id: functions.invoke
    purpose: Invoke a governed function contract while preserving function-specific side-effect policy.
    bindings:
      - binding_id: supabase-edge-functions.invoke
        routing_eligible: false
    lifecycle_ceiling: FEATURE

