policies:
  - id: supabase-caller-boundary-v1
    applies_to: [data.record.read, identity.user.read, storage.object.read, knowledge.vector.search, database.schema.inspect, events.stream.subscribe, functions.invoke]
    rules:
      - Caller selects semantic capability intent, never Supabase/provider/adapter/binding/tool/endpoint.
      - Project and tenant scope are resolved from authenticated identity, configuration and policy.
      - Credential and secret values are forbidden in caller-controlled routing fields.

  - id: supabase-least-privilege-v1
    applies_to: [supabase-mcp]
    rules:
      - Default MCP profile is project-scoped and read-only.
      - MCP feature groups require an explicit allowlist.
      - Mutation tools are excluded by default.
      - Account-level tools are excluded unless a reviewed capability explicitly requires them.
      - Tool discovery does not grant Ginkgo execution authority.

  - id: supabase-database-security-v1
    applies_to: [data.record.read, identity.user.read, knowledge.vector.search, database.schema.inspect]
    rules:
      - Exposed schema tables require RLS unless a reviewed non-user-exposure exception exists.
      - Authentication alone is not row authorization; ownership or tenant policy is required.
      - User-editable metadata is forbidden as an authorization source.
      - Server-controlled authorization metadata must be used for privileged authorization state.
      - Views and privileged functions require explicit security review.
      - SECURITY DEFINER is exception-only and cannot be used as a shortcut around permission errors.
      - Update policies must validate both current-row access and allowed post-update state.

  - id: supabase-secret-isolation-v1
    applies_to: [supabase-js, supabase-py, supabase-mcp, supabase]
    rules:
      - Service-role and secret keys are forbidden in public clients.
      - Secret values are forbidden in CapabilityRequest, CapabilityResult, prompts, logs, traces and evidence.
      - Secret resolution is owned by the governed adapter/runtime boundary.
      - Secret references may be recorded; secret values may not.

  - id: supabase-mutation-deny-default-v1
    applies_to: [data.record.write, storage.object.write, knowledge.vector.upsert, identity.user.manage, database.schema.change]
    rules:
      - Mutation is DENY by default.
      - Read capabilities never imply write authority.
      - Writes require a separate semantic capability, validated binding and identity/tenant authorization.
      - Approval is required whenever the capability risk policy says so.
      - Idempotency and post-write verification are mandatory for promotable write bindings.
      - Schema change is privileged and is never implied by generic SQL or MCP access.

  - id: supabase-evidence-v1
    applies_to: [data.record.read, identity.user.read, storage.object.read, knowledge.vector.search, database.schema.inspect, events.stream.subscribe, functions.invoke]
    rules:
      - Successful transport response alone is not validation evidence.
      - Evidence records policy decision, mode, normalized result summary, verification method and provenance.
      - Evidence must be secret-safe and respect data classification.
      - Cross-tenant negative evidence is required before production promotion for tenant-scoped operations.

  - id: supabase-supply-chain-v1
    applies_to: [supabase-js, supabase-py, supabase-mcp]
    rules:
      - Pin compatible dependency versions and commit lockfiles.
      - Verify package provenance or signatures when available.
      - Consult current upstream changelog/documentation for version-sensitive implementation decisions.

fallbacks:
  data.record.read: none
  identity.user.read: none
  storage.object.read: none
  knowledge.vector.search: none
  database.schema.inspect: none
  events.stream.subscribe: none
  functions.invoke: none

fallback_constraints:
