tools:
  - id: powerbi-mcp-bridge
    taxonomy_role: tool
    kind: mcp-bridge
    purpose: Controlled bridge candidate for reading/operating Power BI through an MCP-compatible tool boundary.
    external_network: false
    write_capability: potentially_privileged
    routing_eligible: false
    production_eligible: false
    note: Must be least-privilege validated before any live use.

  - id: pbip
    taxonomy_role: tool_format
    kind: project-format
    purpose: Power BI project representation used as semantic project input.
    routing_eligible: false

  - id: tmdl
    taxonomy_role: tool_format
    kind: semantic-model-format
    purpose: Semantic model metadata representation used for model-aware analysis.
    routing_eligible: false

  - id: dax
    taxonomy_role: tool_language
    kind: analytical-expression-language
    purpose: Candidate metric expression language for the Power BI binding.
    routing_eligible: false

  - id: deneb
    taxonomy_role: tool
    kind: powerbi-visual-extension
    purpose: Custom visualization surface capable of consuming Vega/Vega-Lite specifications in Power BI.
    routing_eligible: false
    production_eligible: false

  - id: vega-lite
    taxonomy_role: tool_language
    kind: visualization-spec-language
    purpose: Declarative visualization specification language used by the Deneb binding candidate.
    routing_eligible: false

  - id: powerbi-html-content
    taxonomy_role: tool
    kind: powerbi-visual-extension
    purpose: Candidate HTML visual renderer for card/sparkline-style analytical outputs.
    routing_eligible: false
    production_eligible: false

providers:
  - id: microsoft-power-bi
    kind: analytics-platform
    purpose: External BI platform implementation behind the powerbi adapter.
    caller_selectable: false
    routing_eligible: false
    production_eligible: false
    validation_state: UNVALIDATED

policies:
  - id: analytics-read-generate-no-write-v1
    applies_to: [analytics.semantic.inspect, analytics.metric.calculate, analytics.insight.analyze, analytics.visualization.compose, analytics.visual.answer, analytics.dashboard.compose, analytics.report.generate]
    rules:
      - Read/analysis/generation does not imply external mutation authority.
      - Creating or replacing measures, relationships, visuals, reports or dashboards requires a separate governed write capability.
      - Caller cannot select or restrict provider, adapter, binding, tool or model.

  - id: analytics-evidence-v1
    applies_to: [analytics.insight.analyze, analytics.visual.answer, analytics.dashboard.compose, analytics.report.generate]
    rules:
      - Every material analytical claim requires evidence references.
      - Charts are presentation, not evidence by themselves.
      - Generated DAX/SQL/Vega-Lite is not observed evidence until evaluated against an authorized source.
      - Inference must be labeled as inference.
      - Missing or stale data must surface warnings.

  - id: analytics-visual-quality-v1
    applies_to: [analytics.visualization.compose, analytics.visual.answer, analytics.dashboard.compose]
    rules:
      - Validate units, aggregation, time granularity and semantic chart fit.
      - Protect sensitive fields in labels and tooltips.
      - Avoid unjustified dual axes.
      - Part-to-whole visuals require a meaningful total.
      - Styling cannot override analytical correctness or accessibility.

fallbacks:
  analytics.semantic.inspect: none
  analytics.metric.calculate: none
  analytics.insight.analyze: none
  analytics.visualization.compose: none
  analytics.visual.answer: none
  analytics.dashboard.compose: none
  analytics.report.generate: none

