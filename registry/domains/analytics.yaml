version: 1
updated_at: 2026-08-19
domain: analytics
status: FEATURE
priority: P1_HIGH
routing_eligible: false
production_eligible: false
runtime_authority: false

# Domain pack staged on top of the canonical Library registry.
# It does not replace the P0 CapabilityRequest/CapabilityResult contracts and it is not runtime state.
# Canonical taxonomy remains:
# CAPABILITY != SKILL != BINDING != TOOL != ADAPTER != PROVIDER != EXECUTOR

capabilities:
  - id: analytics.semantic.inspect
    purpose: Inspect an authorized analytical semantic model before analysis.
    bindings:
      - skill_id: powerbi.semantic.inspect
        routing_eligible: false
    output_contract: analytics-semantic-inspection.v1
    lifecycle_ceiling: FEATURE

  - id: analytics.metric.calculate
    purpose: Calculate or derive governed analytical metrics without exposing implementation language to callers.
    bindings:
      - skill_id: powerbi.metric.calculate.dax
        routing_eligible: false
    output_contract: analytics-metric-calculation.v1
    lifecycle_ceiling: FEATURE

  - id: analytics.insight.analyze
    purpose: Convert governed observations into labeled findings, comparisons, trends, anomalies, drivers, correlations and inferences.
    bindings:
      - skill_id: analytics.insight.analyze
        provider_neutral: true
        routing_eligible: false
    output_contract: analytics-insight-analysis.v1
    lifecycle_ceiling: FEATURE

  - id: analytics.visualization.compose
    purpose: Compose a renderer-neutral analytical visualization from governed metrics and evidence.
    bindings:
      - skill_id: powerbi.visualization.compose.deneb
        routing_eligible: false
    output_contract: analytics-visualization-spec.v1
    lifecycle_ceiling: FEATURE

  - id: analytics.visual.answer
    purpose: Answer a quantitative business question with summary, findings, metrics, visualizations, warnings and provenance.
    bindings:
      - skill_id: analytics.visual.answer
        provider_neutral: true
        routing_eligible: false
    output_contract: analytics-visual-answer.v1
    lifecycle_ceiling: FEATURE

  - id: analytics.dashboard.compose
    purpose: Compose a renderer-neutral multi-visual dashboard specification without publishing it.
    bindings:
      - skill_id: analytics.dashboard.compose
        provider_neutral: true
        routing_eligible: false
    output_contract: analytics-dashboard-spec.v1
    lifecycle_ceiling: FEATURE

  - id: analytics.report.generate
    purpose: Generate a durable analytical report specification with evidence and caveats without delivering/publishing it.
    bindings:
      - skill_id: analytics.report.generate
        provider_neutral: true
        routing_eligible: false
    output_contract: analytics-report-spec.v1
    lifecycle_ceiling: FEATURE

