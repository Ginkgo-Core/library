      - coding-agents
      - browser-qa
      - ci
      - repository-intelligence
    required_controls:
      - branch-isolation
      - human-review
      - test-evidence
      - ci-gate
      - no-secret-exposure
      - rollback-path
    posture: "internal or managed engineering factory before autonomous external product"

upstream_projects:
  - id: n8n
    url: https://github.com/n8n-io/n8n
    role: workflow-orchestration
    source_license_posture: sustainable-use-license-fair-code
    adoption_note: internal and consulting usage may fit; product embedding/white-label requires explicit review
  - id: dify
    url: https://github.com/langgenius/dify
    role: agent-workflow-rag-app-platform
    source_license_posture: apache-based-with-additional-conditions
    adoption_note: audit multi-tenant and branding constraints
  - id: langflow
    url: https://github.com/langflow-ai/langflow
    role: visual-agent-pipelines
    source_license_posture: MIT
  - id: browser-use
    url: https://github.com/browser-use/browser-use
    role: browser-agent-automation
    source_license_posture: MIT
  - id: crewai
    url: https://github.com/crewAIInc/crewAI
    role: multi-agent-orchestration
    source_license_posture: MIT
  - id: openhands
    url: https://github.com/OpenHands/OpenHands
    role: software-engineering-agent
    source_license_posture: MIT
  - id: comfyui
    url: https://github.com/Comfy-Org/ComfyUI
    role: media-pipeline
    source_license_posture: GPL-3.0
    adoption_note: models and dependent assets may have separate licenses
  - id: moneyprinterturbo
    url: https://github.com/harry0703/MoneyPrinterTurbo
    role: short-form-video-automation
    source_license_posture: MIT
  - id: shortgpt
    url: https://github.com/RayVentura/ShortGPT
    role: short-video-automation
    source_license_posture: MIT
  - id: activepieces
    url: https://github.com/activepieces/activepieces
    role: workflow-automation
    source_license_posture: audit-required
  - id: agenta
    url: https://github.com/Agenta-AI/agenta
    role: agent-evaluation
    source_license_posture: audit-required

promotion_policy:
  library_entry_does_not_authorize_runtime: true
  repository_popularity_is_not_production_evidence: true
  provider_or_tool_names_must_not_define_public_business_capabilities: true
  upstream_components_should_be_replaceable: true
  required_gates:
    - canonical-source-recorded
    - license-reviewed-for-intended-deployment
    - platform-terms-identified
    - buyer-pain-validated
    - end-to-end-evidence
    - audit-path
    - permissions-and-approval-policy
    - cost-to-serve-bounded
    - pricing-hypothesis-tested
    - roi-metric-defined
    - fallback-semantics-documented
    - canonical-promotion-target-identified

evidence_levels:
  E0: source-and-license-provenance
  E1: technical-feasibility
  E2: controlled-end-to-end-pilot
  E3: buyer-validation
  E4: economic-evidence
  E5: repeatability-evidence

anti_patterns:
  - clone-viral-repo-and-call-it-a-business
  - faceless-content-volume-without-distribution-advantage
  - uncontrolled-browser-agent
  - unauthorized-scraping
  - whatsapp-spam
  - unreviewed-multitenant-resale
  - upstream-specific-public-capability-contracts
  - automation-without-evidence-or-recovery
  - roi-claims-without-baseline
