schema_version: "1.0"
registry_id: open-source-monetization-opportunities
status: curated
runtime_authority: false
routing_eligible: false
production_eligible: false
source_verified_at: 2026-08-20

scoring_model:
  scale: "0-5 per factor"
  output_scale: "0-100"
  formula: "sum((rating / 5) * weight)"
  factors:
    revenue_proximity:
      weight: 25
      description: direct connection to revenue, cost reduction or throughput
    speed_to_pilot:
      weight: 20
      description: ability to assemble a credible end-to-end pilot quickly
    recurring_value:
      weight: 15
      description: natural weekly or monthly repeat usage
    defensibility:
      weight: 15
      description: switching cost created by data, integrations and operating history
    margin_potential:
      weight: 10
      description: potential to scale without proportional human labor
    ginkgo_stack_leverage:
      weight: 10
      description: reuse of existing orchestration, WhatsApp, CRM, RAG and analytics assets
    license_confidence:
      weight: 5
      description: commercial-use clarity for the intended deployment model

opportunities:
  - id: revenue-agent
    name: Revenue Agent
    priority: P0-commercial-experiment
    score: 92
    buyer_segments:
      - local-business
      - b2b-services
      - real-estate
      - clinics
    outcomes:
      - qualified-meetings
      - pipeline-reactivation
      - faster-follow-up
      - attributable-revenue-activity
    monetization:
      setup_fee: true
      monthly_managed_service: true
      usage_based: optional
      outcome_based: optional
    candidate_components:
      orchestration:
        - n8n
        - activepieces
      data:
        - supabase
      agents:
        - langflow
        - crewai
      browser_workers:
        - browser-use
      channels:
        - evolution-api
        - official-whatsapp-provider
        - email
      business_systems:
        - crm
        - calendar
      analytics:
        - attribution-dashboard
    required_controls:
      - authorized-data-source
      - consent-policy
      - opt-out
      - rate-limit
      - evidence-capture
      - human-approval-when-required
      - audit-log
    promotion_targets:
      - Ginkgo-Core/ai-stack
      - Ginkgo-Core/ginkgo-agents
      - product-repository
    candidate_capabilities:
      - revenue.lead.normalize
      - revenue.lead.enrich
      - revenue.lead.qualify
      - revenue.outreach.prepare
      - revenue.followup.plan
      - revenue.meeting.attribute
    evidence_required:
      minimum_for_prototype:
        - E0
        - E1
      minimum_for_pilot:
        - E2
        - E3
      minimum_for_production_candidate:
        - E4
        - E5

  - id: whatsapp-knowledge-agent
    name: WhatsApp Knowledge Agent
    priority: P0-P1
    score: 89
    buyer_segments:
      - service-business
      - commerce
      - real-estate
      - internal-operations
    outcomes:
      - lower-response-time
      - higher-resolution-rate
      - reduced-manual-support-load
