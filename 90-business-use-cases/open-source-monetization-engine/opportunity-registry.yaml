      - consent
      - knowledge-provenance
      - confidence-gate
      - human-handoff
      - audit-log
      - evaluation-metrics
    promotion_targets:
      - Ginkgo-Core/ai-stack
      - Ginkgo-Core/ginkgo-agents
      - leaf-or-client-product

  - id: backoffice-process-agents
    name: Backoffice Process Agents
    priority: P1
    score: 86
    buyer_segments:
      - operations-teams
      - finance-ops
      - sales-ops
      - customer-ops
      - commerce-ops
